name: Contributor CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contributor-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check PR whitespace
        working-directory: .
        # Compare the PR merge commit with its base parent, not an empty worktree diff.
        run: git diff --check HEAD^ HEAD
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.13.0"
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm run test
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend lint
        run: npm run lint
      - name: Frontend production build
        run: npm run build

  backend:
    name: Backend checks
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      MLSTUDIO_ENVIRONMENT: test
      MLSTUDIO_HOME: ${{ runner.temp }}/mlstudio-ci
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.2"
      - name: Install backend and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Backend tests
        run: python -m pytest
      - name: Backend lint
        run: python -m ruff check .
      - name: Backend format check
        run: python -m ruff format --check .
      - name: Backend dependency consistency
        run: python -m pip check
      - name: Build backend wheel
        # pip invokes the pyproject.toml Hatchling backend in an isolated build environment.
        run: python -m pip wheel --no-deps --wheel-dir dist .
