name: CLI builds

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'cli/**'
      - 'scripts/bootstrap-cli.*'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/cli.yml'

permissions:
  contents: read

jobs:
  cli:
    name: CLI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
            executable: mls.exe
            suffix: .exe
          - runner: ubuntu-latest
            platform: linux-x64
            executable: mls
            suffix: ''
          - runner: macos-15
            platform: macos-arm64
            executable: mls
            suffix: ''
          - runner: macos-15-intel
            platform: macos-x64
            executable: mls
            suffix: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up application Python prerequisite
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.2'
      - name: Set up application Node prerequisite
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
      - name: Set up pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.99.1 fmt --check
      - run: cargo +1.99.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.99.1 test --locked
      - run: cargo +1.99.1 build --release --locked
      - name: Disposable install and two-server lifecycle smoke
        env:
          EXECUTABLE: ${{ matrix.executable }}
        run: python smoke.py --binary "target/release/$EXECUTABLE"
      - name: Audit installed production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Prepare binary and checksum (no publication)
        env:
          EXECUTABLE: ${{ matrix.executable }}
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p dist
          cp "target/release/$EXECUTABLE" "dist/mls-$PLATFORM$SUFFIX"
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "mls-$PLATFORM$SUFFIX" > SHA256SUMS)
          else
            (cd dist && shasum -a 256 "mls-$PLATFORM$SUFFIX" > SHA256SUMS)
          fi
      - name: Retain manually requested candidates (not GitHub Release assets)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mls-beta-candidate-${{ matrix.platform }}
          path: cli/dist/
          if-no-files-found: error
          retention-days: 7
      # No release creation, tags, write token, or release-asset publication.
