[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mlstudio"
version = "0.0.0"
description = "ML Studio local application backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "platformdirs>=4.3,<5",
  "pandas>=2.2,<4",
  "numpy>=2,<3",
  "scikit-learn==1.9.1",
  "joblib>=1.5.3,<1.6",
  "python-multipart>=0.0.20,<1",
  "psutil>=7,<8",
  "mlflow-skinny==3.16.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/mlstudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
